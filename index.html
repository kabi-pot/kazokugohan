<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>かぞくごはん｜試作版</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;color:#202b28;background:#f5f7f3;font-size:17px}*{box-sizing:border-box}body{margin:0}.app{max-width:720px;margin:auto;min-height:100dvh;padding:18px 16px 105px}header{display:flex;align-items:center;justify-content:space-between;margin:7px 0 20px}h1{font-size:27px;margin:0;letter-spacing:.02em}h2{font-size:21px;margin:0 0 15px}.muted{color:#66746e;font-size:14px}.tabs{display:flex;background:#e8eee9;border-radius:18px;padding:4px;gap:3px;margin:14px 0}.tabs button{flex:1;background:transparent;color:#40554a;border:0;padding:12px 3px;border-radius:14px;font-size:17px;font-weight:700}.tabs button.active{background:#247c58;color:white}.datebar{display:flex;align-items:center;justify-content:space-between;margin:20px 0 16px;font-size:22px;font-weight:800}.datebar button{background:none;border:0;font-size:27px;padding:4px 12px}.card{background:white;border-radius:23px;padding:20px 17px;margin:14px 0;box-shadow:0 5px 18px #283b2d12;border:1px solid #e7ece7}.counts{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;gap:5px}.counts>div+div{border-left:1px solid #dce4dc}.counts b{display:block;font-size:28px;color:#1c6b4e;margin-top:6px}.counts small{font-weight:700;font-size:15px}.mealrow{display:grid;grid-template-columns:80px repeat(3,minmax(0,1fr));align-items:stretch;border-top:1px solid #e8eee9}.mealrow>div{padding:13px 3px;font-size:14px;text-align:center;display:flex;align-items:center;justify-content:center}.mealrow .person{font-weight:800;font-size:16px;justify-content:flex-start}.mealrow button{border:0;border-left:1px solid #eef1ed;background:white;color:#263c32;padding:12px 2px;min-height:57px;font-size:14px;font-weight:700;cursor:pointer}.mealrow button:focus-visible,.primary:focus-visible{outline:3px solid #ffad44}.mealrow.heading{background:#f5f8f5;border-radius:10px}.mealrow.heading>div{font-weight:800;padding:9px 3px}.status-yes{color:#20794a}.status-no{color:#68716d}.status-later{color:#176a98}.status-unknown{color:#a56a10}.late{font-size:12px;color:#ad572a;display:block}.schedule{display:flex;gap:12px;align-items:flex-start;border-top:1px solid #edf0ec;padding:14px 0}.schedule strong{min-width:70px}.schedule span{flex:1}.primary{background:#227c56;color:white;border:0;border-radius:16px;padding:15px 20px;font-size:17px;font-weight:800;cursor:pointer}.secondary{background:#e9f0eb;color:#235e43;border:0;border-radius:14px;padding:12px 16px;font-size:16px;font-weight:700}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#ffffffed;border-top:1px solid #e1e9e2;display:flex;justify-content:center;padding:10px 8px max(12px,env(safe-area-inset-bottom));z-index:5}.bottom>div{width:min(720px,100%);display:flex}.bottom button{flex:1;border:0;background:none;padding:8px 0;color:#53675a;font-size:15px;font-weight:800}.bottom button.active{color:#17734d}.weekitem{border-top:1px solid #e6ebe6;padding:13px 0}.weekitem b{display:block;margin-bottom:6px}.weekitem span{font-size:15px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.calendar button{border:1px solid #e2eae2;background:white;border-radius:11px;padding:10px 0;min-height:49px;font-size:16px}.calendar button.selected{background:#237a56;color:white}.calendar .weekday{font-size:13px;text-align:center;font-weight:800;padding:6px 0}.notice{padding:13px;border-radius:12px;background:#f0f5ee;color:#3d5d4d;font-size:14px;line-height:1.6}dialog{border:0;border-radius:22px;padding:0;width:min(94vw,470px);max-height:88dvh;overflow:auto;box-shadow:0 20px 80px #172d2244}dialog::backdrop{background:#15251c8c}.modal{padding:22px}label{display:block;font-weight:750;margin:15px 0 6px}input,select{width:100%;border:1px solid #cbd9ce;border-radius:12px;padding:13px;background:white;font:inherit;min-height:49px}input[type=checkbox]{width:auto;min-height:auto;transform:scale(1.2);margin-right:8px}.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}.modalfoot{display:flex;gap:9px;justify-content:flex-end;margin-top:22px}.modalfoot button{flex:1}.error{color:#a62929;font-size:14px}.empty{color:#65766a;padding:10px 0}button{touch-action:manipulation} @media(max-width:390px){.app{padding-left:10px;padding-right:10px}.card{padding:16px 11px}.mealrow{grid-template-columns:64px repeat(3,minmax(0,1fr))}.mealrow .person{font-size:14px}.mealrow button{font-size:12px}.datebar{font-size:19px}}
@media(max-width:480px){header{gap:8px}h1{font-size:23px}.app{padding-left:10px;padding-right:10px}.card{padding:16px 10px}.mealrow{grid-template-columns:60px repeat(3,minmax(0,1fr))}.mealrow .person{font-size:14px}.mealrow button{font-size:12px;overflow-wrap:anywhere}.datebar{font-size:19px}.counts b{font-size:24px}.muted{font-size:13px}}
</style></head><body><div class="app"><header><h1>⌂ かぞくごはん</h1><span class="muted">試作版 v0.2</span></header><main id="root"></main></div><nav class="bottom"><div><button data-page="home" class="active">⌂<br>ホーム</button><button data-page="calendar">▦<br>カレンダー</button><button data-page="settings">⚙<br>設定</button></div></nav><dialog id="dlg"><form id="form" class="modal"><h2 id="modalTitle"></h2><div id="fields"></div><p id="err" class="error"></p><div class="modalfoot"><button type="button" class="secondary" id="cancel">戻る</button><button type="submit" class="primary">保存する</button></div></form></dialog><script>
const KEY='kazokugohan-demo-v1';const people=['わたし','夫','息子'];const meals=['朝食','昼食','夕食'];const statuses={yes:'食べる',no:'食べない',unknown:'未定',later:'作っておいて欲しい'};const icons={yes:'✓',no:'×',unknown:'？',later:'▣'};const today=new Date();today.setHours(0,0,0,0);const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const add=(d,n)=>{let x=new Date(d);x.setDate(x.getDate()+n);return x};const format=d=>`${d.getMonth()+1}月${d.getDate()}日（${'日月火水木金土'[d.getDay()]}）`;const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){}state=state&&typeof state==='object'?state:{answers:{},events:[],deadlines:['08:00','11:00','15:00']};state.answers??={};state.events??=[];state.deadlines??=['08:00','11:00','15:00'];if(!state.lateFlagsMigratedV2){Object.values(state.answers).forEach(a=>{if(a&&typeof a==='object')a.late=false});state.lateFlagsMigratedV2=true;try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}let page='home',mode='today',selected=new Date(today),editEvent=null;const save=()=>localStorage.setItem(KEY,JSON.stringify(state));const answer=(date,person,meal)=>state.answers[`${date}|${person}|${meal}`]||{status:'unknown'};const count=(date,meal)=>people.reduce((a,p,i)=>{let s=answer(date,i,meal).status;a[s]=(a[s]||0)+1;return a},{yes:0,no:0,later:0,unknown:0});const deadlinePassed=(date,meal)=>new Date(`${date}T${state.deadlines[meal]||'15:00'}:00`).getTime()<Date.now();function setPage(p){page=p;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()};document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>setPage(b.dataset.page));function render(){let root=document.querySelector('#root');root.innerHTML=page==='home'?home():page==='calendar'?calendar():settings();root.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;selected=mode==='tomorrow'?add(today,1):new Date(today);render()});root.querySelectorAll('[data-shift]').forEach(b=>b.onclick=()=>{selected=add(selected,Number(b.dataset.shift));render()});root.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>openAnswer(b.dataset.date,Number(b.dataset.person),Number(b.dataset.meal)));root.querySelectorAll('[data-event]').forEach(b=>b.onclick=()=>openEvent(b.dataset.event==='new'?null:Number(b.dataset.event)));root.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{selected=new Date(`${b.dataset.day}T12:00:00`);render()});root.querySelectorAll('[data-setting]').forEach(b=>b.onchange=e=>{state.deadlines[Number(b.dataset.setting)]=e.target.value;save()})}
function mealTable(date){return `<div class="mealrow heading"><div>家族</div>${meals.map(m=>`<div>${m}</div>`).join('')}</div>${people.map((p,i)=>`<div class="mealrow"><div class="person">${p}</div>${meals.map((m,j)=>{let a=answer(date,i,j),late=a.late&&a.changedAt;return `<button data-answer="1" data-date="${date}" data-person="${i}" data-meal="${j}" aria-label="${p} ${m} ${statuses[a.status]}"><span class="status-${a.status}">${icons[a.status]} ${a.status==='later'?'作っておいて':statuses[a.status]}</span>${a.status==='later'&&a.time?`<span class="muted" style="display:block">帰宅 ${escapeHTML(a.time)}</span>`:''}${late?'<span class="late">期限後変更</span>':''}</button>`}).join('')}</div>`).join('')}`}
function summary(date){return `<div class="card"><h2>♨ 食事の準備</h2><div class="counts">${meals.map((m,j)=>{let c=count(date,j);return `<div><small>${m}</small><b>${c.yes+c.later}人分</b><span class="muted">未定 ${c.unknown}人</span></div>`}).join('')}</div></div>`}function eventList(date){let ev=state.events.filter(e=>e.date===date).sort((a,b)=>a.time.localeCompare(b.time));return `<div class="card"><h2>▦ ${format(new Date(date+'T12:00:00'))}の予定</h2>${ev.length?ev.map(e=>`<div class="schedule"><strong>${people[e.person]}</strong><span>${escapeHTML(e.time||'終日')} ${escapeHTML(e.title)}</span><button class="secondary" data-event="${state.events.indexOf(e)}">編集</button></div>`).join(''):'<div class="empty">登録された予定はありません</div>'}<div class="actions"><button class="primary" data-event="new">＋ 予定を登録</button></div></div>`}function home(){let date=iso(selected);if(mode==='week'){return `<div class="tabs">${tabButtons()}</div><div class="card"><h2>今週の食事予定</h2>${Array.from({length:7},(_,i)=>{let d=add(today,i),dt=iso(d);return `<div class="weekitem"><b>${format(d)}</b><span>${meals.map((m,j)=>{let c=count(dt,j);return `${m} ${c.yes+c.later}人${c.unknown?`（未定${c.unknown}）`:''}`}).join(' ／ ')}</span><div class="actions"><button class="secondary" data-day="${dt}">この日を開く</button></div></div>`}).join('')}</div>`}return `<div class="tabs">${tabButtons()}</div><div class="datebar"><button data-shift="-1" aria-label="前の日">‹</button><span>${format(selected)}</span><button data-shift="1" aria-label="次の日">›</button></div>${summary(date)}<div class="card"><h2>♧ 家族の食事予定</h2><p class="muted">各マスを押すと回答を変更できます。夕食の回答期限 ${state.deadlines[2]}</p>${mealTable(date)}</div>${eventList(date)}`}
function tabButtons(){return [['today','今日'],['tomorrow','明日'],['week','週間']].map(([k,v])=>`<button data-mode="${k}" class="${mode===k?'active':''}">${v}</button>`).join('')}
function calendar(){let year=selected.getFullYear(),month=selected.getMonth(),start=new Date(year,month,1).getDay(),days=new Date(year,month+1,0).getDate();return `<div class="datebar"><button data-shift="-30">‹</button>${year}年${month+1}月<button data-shift="30">›</button></div><div class="card"><div class="calendar">${'日月火水木金土'.split('').map(d=>`<div class="weekday">${d}</div>`).join('')}${Array(start).fill('<span></span>').join('')}${Array.from({length:days},(_,i)=>{let d=new Date(year,month,i+1),s=iso(d);return `<button data-day="${s}" class="${s===iso(selected)?'selected':''}">${i+1}${state.events.some(e=>e.date===s)?' •':''}</button>`}).join('')}</div></div>${summary(iso(selected))}${eventList(iso(selected))}`}
function settings(){return `<div class="card"><h2>⚙ 回答期限</h2><p class="muted">期限後も回答・変更できます。期限後の変更は画面に表示されます。</p>${meals.map((m,i)=>`<label>${m}の回答期限</label><input type="time" data-setting="${i}" value="${state.deadlines[i]}">`).join('')}</div><div class="card"><h2>家族</h2><p>わたし・夫・息子（試作版では固定）</p></div><div class="notice">この試作版は入力内容を現在のブラウザ内だけに保存します。家族のiPhone間では共有されません。個人情報や本番の予定を入れる前に、共有機能とアクセス制御を実装します。</div>`}
const dlg=document.querySelector('#dlg'),fields=document.querySelector('#fields'),form=document.querySelector('#form');document.querySelector('#cancel').onclick=()=>dlg.close();function openAnswer(date,person,meal){editEvent=null;let a=answer(date,person,meal);document.querySelector('#modalTitle').textContent=`${people[person]}｜${meals[meal]}の回答`;fields.innerHTML=`<p class="muted">${escapeHTML(date)}　回答期限 ${state.deadlines[meal]}</p><label for="status">食事の予定</label><select id="status">${Object.entries(statuses).map(([k,v])=>`<option value="${k}" ${a.status===k?'selected':''}>${v}</option>`).join('')}</select><div id="timeWrap"><label for="returnTime">帰宅予定時刻（任意）</label><input id="returnTime" type="time" value="${escapeHTML(a.time||'')}"></div>`;let status=fields.querySelector('#status'),wrap=fields.querySelector('#timeWrap');const sync=()=>wrap.hidden=status.value!=='later';status.onchange=sync;sync();form.onsubmit=e=>{e.preventDefault();let s=status.value,prev=answer(date,person,meal);state.answers[`${date}|${person}|${meal}`]={status:s,time:s==='later'?fields.querySelector('#returnTime').value:'',late:(prev.late||false)||(deadlinePassed(date,meal)&&Boolean(prev.changedAt)&&(s!==prev.status||(s==='later'&&fields.querySelector('#returnTime').value!==(prev.time||'')))),changedAt:new Date().toISOString()};save();dlg.close();render()};dlg.showModal()}
function openEvent(index){editEvent=index;let e=index===null?{date:iso(selected),person:0,title:'',time:''}:state.events[index];document.querySelector('#modalTitle').textContent=index===null?'予定を登録':'予定を編集';fields.innerHTML=`<label for="eventDate">日付</label><input type="date" id="eventDate" required value="${escapeHTML(e.date)}"><label for="eventPerson">家族</label><select id="eventPerson">${people.map((p,i)=>`<option value="${i}" ${e.person===i?'selected':''}>${p}</option>`).join('')}</select><label for="eventTitle">予定</label><input id="eventTitle" required maxlength="80" placeholder="例：飲み会、部活" value="${escapeHTML(e.title)}"><label for="eventTime">開始時刻（任意）</label><input id="eventTime" type="time" value="${escapeHTML(e.time)}"><label><input type="checkbox" id="alsoMeal">この予定と一緒に食事も回答する</label><div id="mealExtra" hidden><label for="eventMeal">食事</label><select id="eventMeal">${meals.map((m,i)=>`<option value="${i}">${m}</option>`).join('')}</select><label for="eventStatus">回答</label><select id="eventStatus">${Object.entries(statuses).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select><label for="eventReturn">帰宅予定時刻（作り置き希望の場合・任意）</label><input type="time" id="eventReturn"></div>${index!==null?'<div class="actions"><button type="button" class="secondary" id="deleteEvent">この予定を削除</button></div>':''}`;let checkbox=fields.querySelector('#alsoMeal');checkbox.onchange=()=>fields.querySelector('#mealExtra').hidden=!checkbox.checked;if(index!==null)fields.querySelector('#deleteEvent').onclick=()=>{if(confirm('この予定を削除しますか？')){state.events.splice(index,1);save();dlg.close();render()}};form.onsubmit=ev=>{ev.preventDefault();let date=fields.querySelector('#eventDate').value,person=Number(fields.querySelector('#eventPerson').value),title=fields.querySelector('#eventTitle').value.trim(),time=fields.querySelector('#eventTime').value;if(!title)return;let obj={date,person,title,time};if(index===null)state.events.push(obj);else state.events[index]=obj;if(checkbox.checked){let meal=Number(fields.querySelector('#eventMeal').value),status=fields.querySelector('#eventStatus').value,prev=answer(date,person,meal),returnTime=status==='later'?fields.querySelector('#eventReturn').value:'';state.answers[`${date}|${person}|${meal}`]={status,time:returnTime,late:(prev.late||false)||(deadlinePassed(date,meal)&&Boolean(prev.changedAt)&&(status!==prev.status||returnTime!==(prev.time||''))),changedAt:new Date().toISOString()}}save();dlg.close();render()};dlg.showModal()}
render();</script></body></html>
